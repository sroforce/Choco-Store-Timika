<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin — Choco Store Timika</title>
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cc:#2B1712;--cd:#3A211B;--cg:#C79552;--cr:#F7F1E8;--cbe:#E8DCCB;--err:#E05B5B;--ok:#4CAF50;--ff:'Plus Jakarta Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--ff);background:#F5F5F5;color:#333;min-height:100vh;display:flex}

/* LOGIN SCREEN */
#loginScreen{position:fixed;inset:0;background:var(--cc);display:flex;align-items:center;justify-content:center;z-index:100}
.login-box{background:var(--cd);border:1px solid rgba(199,149,82,.2);border-radius:8px;padding:3rem;width:100%;max-width:400px}
.login-logo{font-family:'Plus Jakarta Sans',sans-serif;font-size:1.3rem;font-weight:700;color:var(--cr);margin-bottom:.25rem}
.login-logo span{color:var(--cg);font-style:italic}
.login-sub{font-size:.82rem;color:rgba(247,241,232,.5);margin-bottom:2rem}
.login-box label{display:block;font-size:.75rem;font-weight:600;color:rgba(247,241,232,.6);margin-bottom:.4rem;letter-spacing:.08em;text-transform:uppercase}
.login-box input{width:100%;padding:.75rem 1rem;background:rgba(43,23,18,.5);border:1px solid rgba(199,149,82,.2);border-radius:4px;color:var(--cr);font-family:var(--ff);font-size:.92rem;margin-bottom:1.25rem;transition:border-color .2s}
.login-box input:focus{outline:none;border-color:var(--cg)}
.login-box input:disabled{opacity:.5;cursor:not-allowed}
.login-btn{width:100%;padding:.85rem;background:var(--cg);color:var(--cc);border:none;border-radius:4px;font-family:var(--ff);font-size:.92rem;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:.5rem}
.login-btn:hover:not(:disabled){background:#D4A86A}
.login-btn:disabled{opacity:.65;cursor:not-allowed}
.login-err{font-size:.82rem;color:var(--err);margin-top:.75rem;display:none;line-height:1.5}

/* Auth checking state */
#authCheck{text-align:center;padding:1.5rem 0}
.auth-spin{display:inline-block;width:28px;height:28px;border:2.5px solid rgba(199,149,82,.25);border-top-color:var(--cg);border-radius:50%;animation:spin .9s linear infinite;margin-bottom:.75rem}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-check-text{color:rgba(247,241,232,.5);font-size:.85rem}

/* SIDEBAR */
.sidebar{width:260px;background:var(--cc);min-height:100vh;flex-shrink:0;display:flex;flex-direction:column;padding:2rem 0}
        <div class="form-actions"><button class="btn-save" id="btnSvHr" data-label="Simpan Jam" onclick="saveHours()">Simpan Jam</button></div>
      </div>

      <!-- INFO BRAND -->
      <div class="form-grid" style="margin-bottom:2rem;padding-bottom:2rem;border-bottom:1px solid #E8E8E8">
        <h3 style="font-size:1rem;font-weight:700;color:#333;margin-bottom:.25rem">Identitas Brand</h3>
        <p style="font-size:.82rem;color:#999;margin-bottom:.75rem">Nama dan deskripsi toko</p>
        <div class="form-group"><label>Nama Toko</label><input type="text" id="cfgBrandName" placeholder="Choco Store Timika"></div>
        <div class="form-group"><label>Tagline</label><input type="text" id="cfgBrandTagline" placeholder="Your Premium Chocolate Destination"></div>
        <div class="form-group"><label>Deskripsi Singkat</label><textarea id="cfgBrandDesc" placeholder="Toko dan gudang cokelat premium di Timika..."></textarea></div>
        <div class="form-actions"><button class="btn-save" id="btnSvBr" data-label="Simpan Brand" onclick="saveBrand()">Simpan Brand</button></div>
      </div>

      <!-- SEO -->
      <div class="form-grid">
        <h3 style="font-size:1rem;font-weight:700;color:#333;margin-bottom:.25rem">SEO &amp; Metadata</h3>
        <p style="font-size:.82rem;color:#999;margin-bottom:.75rem">Muncul di Google Search dan saat link dibagikan</p>
        <div class="form-group"><label>Title Tag</label><input type="text" id="cfgSeoTitle" placeholder="Choco Store Timika — Toko &amp; Gudang Cokelat Premium"></div>
        <div class="form-group"><label>Meta Description</label><textarea id="cfgSeoDesc" placeholder="Deskripsi singkat yang muncul di Google (maks 160 karakter)"></textarea></div>
        <div class="form-group"><label>Keywords</label><input type="text" id="cfgSeoKeys" placeholder="toko cokelat Timika, cokelat grosir Papua, ..."></div>
        <div class="form-group"><label>Canonical URL</label><input type="url" id="cfgSeoCanon" placeholder="https://chocostoretimika.com"><p class="form-hint">URL utama website (untuk mencegah duplikat konten di Google)</p></div>
        <div class="form-actions"><button class="btn-save" id="btnSvSe" data-label="Simpan SEO" onclick="saveSeo()">Simpan SEO</button></div>
      </div>
    </div>

  </div><!-- /admin-content -->
</div><!-- /admin-main -->


<script type="module" src="./js/admin-firestore.js"></script>
</body>
</html>
